version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-portal-app
    ports:
      - "5050:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/job_portal
      JWT_SECRET: change_me_in_production
      CORS_ORIGINS: http://localhost:5050
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: job-portal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
